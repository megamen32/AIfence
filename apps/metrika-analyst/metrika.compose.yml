services:
  metrika-mcp:
    build:
      context: .
      dockerfile: metrika.Dockerfile
    environment:
      YANDEX_METRIKA_TOKEN: ${YANDEX_METRIKA_TOKEN:?Supply authorized read-only token in environment}
      SUPERGATEWAY_API_KEY: ${SUPERGATEWAY_API_KEY:?Supply a separate gateway key; configure it in Airlock MCP credentials}
      YANDEX_METRIKA_ENABLE_WRITE: "false"
    network_mode: "container:${AIFENCE_CORE_CONTAINER:?Select the running local Airlock core container}"
    stdin_open: true
    restart: unless-stopped
