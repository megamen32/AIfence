# Native Baserow, reachable only through the authenticated Airlock application.
services:
  baserow:
    image: baserow/baserow:2.4.3
    platform: ${BASEROW_PLATFORM:-linux/arm64}
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:?Set the Airlock application origin}
      BASEROW_FRONTEND_COOKIE_PREFIX: aifence_baserow
    volumes:
      - data:/baserow/data
    networks:
      - app_private
    restart: unless-stopped
volumes:
  data:
networks:
  app_private:
    external: true
    name: ${BASEROW_AIRLOCK_NETWORK:?Set the Airlock application runtime network}
